name: YOSHRUN Android Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot Android export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          mkdir -p build

      - name: Validate and import project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: godot --headless --path . --verbose --export-debug "Android" build/YOSHRUN-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YOSHRUN-Android-debug
          path: build/YOSHRUN-debug.apk
          if-no-files-found: error
          retention-days: 14
