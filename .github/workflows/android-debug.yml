name: YOSHRUN Android Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Godot Android export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mkdir -p ~/.local/share/godot/export_templates/4.3.stable
            cp -a /root/.local/share/godot/export_templates/4.3.stable/. ~/.local/share/godot/export_templates/4.3.stable/
          fi
          test -d /usr/lib/android-sdk/platform-tools
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -f /root/debug.keystore
          cat > ~/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Validate and import project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: godot --headless --path . --verbose --export-debug "Android" build/YOSHRUN-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YOSHRUN-Android-debug
          path: build/YOSHRUN-debug.apk
          if-no-files-found: error
          retention-days: 14
